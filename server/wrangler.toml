# Déploiement automatique : GitHub > Actions > « Serveur (chat IA) » (voir .github/workflows/server.yml)
# À la main : cd server && npx wrangler deploy, puis npx wrangler secret put ANTHROPIC_API_KEY (facultatif)
name = "traceo-api"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PAYPAL_ENV = "live"
APP_ORIGIN = "https://traceo.eu.org,https://traceorun.pages.dev,https://traceo.pages.dev,https://pierrernrd04-ai.github.io,https://localhost,capacitor://localhost"
PUSH_SUBJECT = "https://pierrernrd04-ai.github.io/traceo/"
ALERTS_TOPIC = "traceo-alertes-94082f64b4"
PAYPAL_MERCHANT_ID = "7AR8HKPQ9RGH2"
# Domaine gratuit traceo.eu.org : compte Cloudflare où le brancher (le jeton CF_API_TOKEN est un secret, voir domaine() dans worker.js)
CF_ACCOUNT_ID = "b408ac1ecb8c5d0628c2d659f918ae7e"
# PAYPAL_CLIENT_ID et PAYPAL_PLAN_ID : à ajouter ici ou dans le tableau de bord Cloudflare

# « Ensemble » : comptes, positions approximatives, messages (Durable Object SQLite, offre gratuite)
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Référencement automatique : toutes les heures (à la 7e minute), le serveur signale à IndexNow (Bing, DuckDuckGo, Ecosia,
# Qwant, Yahoo, Yandex…) les pages nouvelles ou modifiées du sitemap. Aucune action manuelle (voir seo() dans worker.js).
# Placé avant [ai] : le second essai de .github/workflows/server.yml efface tout à partir de [ai].
[triggers]
crons = ["7 * * * *"]

# IA gratuite de Cloudflare pour le chat quand il n'y a pas de clé Anthropic (laisser en dernier, voir ci-dessus)
[ai]
binding = "AI"
