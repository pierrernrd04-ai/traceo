# Déploiement : cd server && npx wrangler deploy
# Puis : npx wrangler secret put ANTHROPIC_API_KEY (chat) et, si abonnement PayPal, PAYPAL_SECRET
name = "traceo-api"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PAYPAL_ENV = "live"
APP_ORIGIN = "https://traceo.pages.dev,https://pierrernrd04-ai.github.io,https://localhost,capacitor://localhost"
# PAYPAL_CLIENT_ID et PAYPAL_PLAN_ID : à ajouter ici ou dans le tableau de bord Cloudflare
