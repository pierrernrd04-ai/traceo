# Met en ligne le serveur de Traceo (coach IA du chat, « Ensemble », vérification PayPal) sur Cloudflare Workers,
# sans ordinateur : GitHub > Actions > « Serveur (chat IA) » > Run workflow.
# Secrets à créer une fois (GitHub > Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN   jeton Cloudflare (modèle « Edit Cloudflare Workers »)      obligatoire
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare                            obligatoire
#   ANTHROPIC_API_KEY      clé API Anthropic (console.anthropic.com)                   facultatif
#     sans clé Anthropic, le coach utilise l'IA gratuite de Cloudflare (Workers AI) ; avec, il passe sur Claude.
# Une fois déployé, l'adresse du serveur est écrite automatiquement dans config.js (CHAT_API).
name: Serveur (chat IA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**"]

permissions:
  contents: write

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Vérifier les secrets
        id: check
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Secrets manquants :$missing. Ajoute-les dans Settings > Secrets and variables > Actions, puis relance."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            [ -z "$ANTHROPIC_API_KEY" ] && echo "::notice::Pas de clé Anthropic : le coach utilisera l'IA gratuite de Cloudflare."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Installer les dépendances du serveur
        if: steps.check.outputs.ok == 'true'
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Déployer sur Cloudflare Workers
        id: deploy
        if: steps.check.outputs.ok == 'true'
        working-directory: server
        run: |
          set -o pipefail
          rm -f wr-test.toml
          if ! npx wrangler deploy 2>&1 | tee /tmp/deploy.log; then
            echo "::warning::Déploiement refusé avec l'IA Cloudflare (droits du jeton ?) : nouvel essai sans elle."
            sed -i '/^\[ai\]/,$d' wrangler.toml
            npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          fi
          grep -q "Uploaded\|Deployed" /tmp/deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; fi

      - name: Tester le serveur
        if: steps.check.outputs.ok == 'true' && steps.deploy.outputs.url != ''
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Serveur : $URL"
          sleep 5
          curl -sS "$URL/health" | grep -q '"ok":true'
          curl -sS "$URL/social/vapid" | tee /tmp/vapid.json; echo
          grep -q '"key"' /tmp/vapid.json
          curl -sS -X POST "$URL/chat" -H "Content-Type: application/json" -H "Origin: https://pierrernrd04-ai.github.io" \
            -d '{"messages":[{"role":"user","content":"Quelle allure pour 10 km en 50 minutes ?"}]}' | tee /tmp/chat.json; echo
          grep -q '"reply"' /tmp/chat.json || echo "::warning::Le chat IA ne répond pas encore (l'app garde son assistant intégré)."

      - name: Brancher le serveur dans l'app (config.js)
        if: steps.check.outputs.ok == 'true' && steps.deploy.outputs.url != ''
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if grep -q "CHAT_API: \"$URL\"" config.js; then echo "Déjà branché."; exit 0; fi
          sed -i "s#CHAT_API: \"[^\"]*\"#CHAT_API: \"$URL\"#" config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Serveur branché : CHAT_API = $URL"
          git pull --rebase origin main
          git push
